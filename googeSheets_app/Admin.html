<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 1.8em;
      margin-bottom: 5px;
    }
    
    .input-section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    
    .group-input {
      margin-bottom: 15px;
    }
    
    .group-input label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    
    .group-input.now-boarding label {
      color: #4CAF50;
    }
    
    .group-input.up-next label {
      color: #FF9800;
    }
    
    .group-input.coming-soon label {
      color: #2196F3;
    }
    
    .group-input input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 5px;
    }
    
    .group-input.now-boarding input {
      border-color: #4CAF50;
    }
    
    .group-input.up-next input {
      border-color: #FF9800;
    }
    
    .group-input.coming-soon input {
      border-color: #2196F3;
    }
    
    .btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px 0;
      transition: transform 0.2s;
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn-primary {
      background: #4CAF50;
      color: white;
    }
    
    .btn-advance {
      background: #FF9800;
      color: white;
    }
    
    .btn-danger {
      background: #f44336;
      color: white;
    }
    
    .status {
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      text-align: center;
      display: none;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    
    .help-text {
      font-size: 0.9em;
      color: #666;
      margin-top: 5px;
    }
    
    .current-preview {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 5px;
      margin-top: 20px;
    }
    
    .current-preview h3 {
      margin-bottom: 10px;
      color: #1976D2;
    }
    
    .preview-buses {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .preview-bus {
      background: #2196F3;
      color: white;
      padding: 8px 12px;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚌 Bus Queue Manager</h1>
    <p>Staff Admin Panel</p>
  </div>
  
  <div class="input-section">
    <div class="group-input now-boarding">
      <label>🚌 NOW BOARDING</label>
      <input type="text" id="nowBoarding" placeholder="e.g., 5, 12, 8, 15, 22">
      <div class="help-text">These buses are currently loading</div>
    </div>
    
    <div class="group-input up-next">
      <label>⏭️ UP NEXT</label>
      <input type="text" id="upNext" placeholder="e.g., 3, 18, 9, 14, 27">
      <div class="help-text">These buses will be called next</div>
    </div>
    
    <div class="group-input coming-soon">
      <label>📋 COMING SOON</label>
      <input type="text" id="comingSoon" placeholder="e.g., 6, 11, 20, 25">
      <div class="help-text">These buses are in the queue</div>
    </div>
    
    <div id="additionalGroups"></div>
    
    <button class="btn btn-primary" onclick="updateAll()">
      ✅ Update All Displays
    </button>
    
    <button class="btn btn-advance" onclick="advanceQueue()">
      ⏩ Advance Queue (Move Up Next → Now Boarding)
    </button>
    
    <button class="btn btn-danger" onclick="clearAll()">
      🗑️ Clear All Buses
    </button>
    
    <div id="status" class="status"></div>
  </div>
  
  <div class="current-preview" id="preview" style="display:none;">
    <h3>Current Display Preview:</h3>
    <div id="previewContent"></div>
  </div>

  <script>
    // Load current data on page load
    window.onload = function() {
      loadCurrentData();
    };
    
    function loadCurrentData() {
      google.script.run
        .withSuccessHandler(populateFields)
        .withFailureHandler(showError)
        .getBusData();
    }
    
    function populateFields(data) {
      if (data && data.length > 0) {
        if (data[0]) document.getElementById('nowBoarding').value = data[0].buses.join(', ');
        if (data[1]) document.getElementById('upNext').value = data[1].buses.join(', ');
        if (data[2]) document.getElementById('comingSoon').value = data[2].buses.join(', ');
      }
    }
    
    function updateAll() {
      const groups = [
        {
          status: 'NOW BOARDING',
          buses: parseInput('nowBoarding')
        },
        {
          status: 'UP NEXT',
          buses: parseInput('upNext')
        },
        {
          status: 'COMING SOON',
          buses: parseInput('comingSoon')
        }
      ];
      
      showStatus('Updating displays...', 'info');
      
      google.script.run
        .withSuccessHandler(function(result) {
          showStatus('✅ Displays updated successfully!', 'success');
          setTimeout(() => hideStatus(), 3000);
        })
        .withFailureHandler(showError)
        .updateBusData(groups);
    }
    
    function advanceQueue() {
      if (!confirm('Move "Up Next" to "Now Boarding" and shift all groups up?')) {
        return;
      }
      
      showStatus('Advancing queue...', 'info');
      
      google.script.run
        .withSuccessHandler(function(result) {
          showStatus('✅ Queue advanced!', 'success');
          // Reload to show new positions
          setTimeout(() => {
            loadCurrentData();
            hideStatus();
          }, 1500);
        })
        .withFailureHandler(showError)
        .advanceQueue();
    }
    
    function clearAll() {
      if (!confirm('Clear all bus numbers from displays?')) {
        return;
      }
      
      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('nowBoarding').value = '';
          document.getElementById('upNext').value = '';
          document.getElementById('comingSoon').value = '';
          showStatus('✅ All buses cleared!', 'success');
          setTimeout(() => hideStatus(), 3000);
        })
        .withFailureHandler(showError)
        .clearAllBuses();
    }
    
    function parseInput(fieldId) {
      const input = document.getElementById(fieldId).value;
      return input
        .split(',')
        .map(b => b.trim())
        .filter(b => b !== '');
    }
    
    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status ' + type;
      status.style.display = 'block';
    }
    
    function hideStatus() {
      document.getElementById('status').style.display = 'none';
    }
    
    function showError(error) {
      showStatus('❌ Error: ' + error.message, 'error');
    }
  </script>
</body>
</html>
